# Portail de dépôt sur le VPS Hostinger, servi par le Traefik déjà en place (réseau « proxy »,
# point d'entrée « websecure », résolveur de certificats « le »), et son antivirus ClamAV, joignable
# seulement par le portail (réseau « depot »). Aucun port publié sur l'hôte : seul un routeur HTTPS
# « depot » est ajouté pour DEPOT_HOST.
#
# install.sh copie ce fichier dans /opt/depot/compose.yaml et c'est cette copie qui sert : un push
# sur GitHub change le code du portail, jamais la façon dont Docker le lance (droits, volumes).
name: depot

services:
  app:
    build:
      context: /opt/depot/src
      dockerfile: Dockerfile
    image: depot-app:latest
    container_name: depot
    restart: unless-stopped
    env_file:
      - /opt/depot/app.env
    environment:
      PUBLIC_URL: https://${DEPOT_HOST:-files.aymenbenali.com}
      CLAMAV_HOST: clamav
    volumes:
      - /opt/depot/data:/data
    networks:
      - proxy
      - depot
    # Conteneur verrouillé : système de fichiers en lecture seule, aucun privilège.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.depot.rule=Host(`${DEPOT_HOST:-files.aymenbenali.com}`)
      - traefik.http.routers.depot.entrypoints=websecure
      - traefik.http.routers.depot.tls=true
      - traefik.http.routers.depot.tls.certresolver=le
      - traefik.http.services.depot.loadbalancer.server.port=8080

  # Antivirus : base de signatures mise à jour toute seule (freshclam), gardée dans un volume.
  clamav:
    image: clamav/clamav:stable
    container_name: depot-clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 2100M
      CLAMD_CONF_MaxFileSize: 2100M
      CLAMD_CONF_MaxScanSize: 2100M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - depot
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  proxy:
    external: true
  depot: {}

volumes:
  clamav-db: {}
